<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>Bom Paladar — anúncio</title>
    <link rel="stylesheet" href="comp.css" />
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="stage">
      <canvas id="fxBack"></canvas>
      <div id="scenes"></div>
      <canvas id="fxFront"></canvas>
      <div id="flash"></div>
      <div id="vignette"></div>
      <div id="grain"></div>
    </div>
    <svg width="0" height="0" style="position: absolute">
      <filter id="hblur" x="-10%" y="0" width="120%" height="100%" color-interpolation-filters="sRGB">
        <feGaussianBlur id="hblurf" stdDeviation="0 0" />
      </filter>
    </svg>
    <!-- Sem o render.cjs (que injeta window.TIMELINE), carrega o timeline.json por HTTP para pré-visualizar. -->
    <script>
      if (!window.TIMELINE) {
        const x = new XMLHttpRequest()
        x.open('GET', '../timeline.json', false)
        x.send()
        window.TIMELINE = JSON.parse(x.responseText)
      }
    </script>
    <script src="comp.js"></script>
  </body>
</html>
